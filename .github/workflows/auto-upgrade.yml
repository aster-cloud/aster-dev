name: Auto Upgrade aster-lang-ts

# 拉取模型：aster-lang-ts 发版后不再跨 org 推送触发本 workflow（跨 org 凭据刻意不放宽），
# 改由本仓每日定时查 npm 最新版，与 package.json 钉版比较后决定是否开升级 PR。
# 也可手动触发；version 留空即取 npm latest。
# 决策逻辑在 scripts/resolve-aster-lang-upgrade.mjs（有单测）。
on:
  schedule:
    # 每日一次。未发新版时只跑轻量的 resolve job（稀疏检出 + npm view），成本可忽略。
    - cron: '23 21 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'aster-lang-ts 版本（如 1.0.32 或 v1.0.32）；留空取 npm latest'
        required: false
        default: ''

# 同一时刻只允许一个升级流程，避免定时与手动触发并发推同一分支。
concurrency:
  group: auto-upgrade-aster-lang-ts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    # 所有 job 设 timeout，避免 runner 不接活时排队到默认 24h。
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      action: ${{ steps.decide.outputs.action }}
      version: ${{ steps.decide.outputs.version }}
      branch: ${{ steps.decide.outputs.branch }}
    steps:
      # 只需 package.json 与决策脚本：稀疏检出让「已是最新」的日常空跑保持廉价。
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            package.json
            scripts/resolve-aster-lang-upgrade.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Decide (latest vs pinned, open PR check)
        id: decide
        env:
          # 输入经 env 传入，不直接拼进 shell，避免注入；脚本内再做严格版本格式校验。
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/resolve-aster-lang-upgrade.mjs resolve

  upgrade:
    needs: resolve
    if: ${{ needs.resolve.outputs.action == 'upgrade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      BRANCH: ${{ needs.resolve.outputs.branch }}
    steps:
      # 用 org 已有的 CROSS_REPO_TOKEN（fine-grained PAT）推分支、开 PR：
      # public 仓库对 bot（github.token）触发的 run 挂 action_required，required check `quality` 永不报告；
      # PAT 触发的 pull_request CI 照常自动运行。未配时回落 github.token，PR 仍会开出但 CI 需人工处理。
      - name: Resolve token (CROSS_REPO_TOKEN, fallback to github.token)
        id: tok
        env:
          PAT: ${{ secrets.CROSS_REPO_TOKEN }}
          FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${PAT:-}" ]; then
            echo "token=${PAT}" >> "$GITHUB_OUTPUT"
            echo "::notice::使用 CROSS_REPO_TOKEN —— 升级 PR 的 CI 将自动运行"
          else
            echo "token=${FALLBACK}" >> "$GITHUB_OUTPUT"
            echo "::warning::未配 CROSS_REPO_TOKEN，回落 github.token —— 升级 PR 的 CI 不会自动运行（public 仓库 bot 审批门）"
          fi

      # checkout 必须带同一令牌：git push 用的是 checkout 写入的凭据，push 决定 CI run 的触发者。
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.tok.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # 本仓只有 package.json 一处钉版；bump-pins 按脚本中的 SECONDARY_PINS（当前为空）同步其余钉版。
      - name: Bump aster-lang-ts pin
        run: |
          set -euo pipefail
          pnpm add --save-exact "@aster-cloud/aster-lang-ts@${VERSION}"
          node scripts/resolve-aster-lang-upgrade.mjs bump-pins "${VERSION}"

      # 与 ci.yml 相同的质量门。
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Create upgrade PR
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): upgrade @aster-cloud/aster-lang-ts to ${VERSION}"
          # 分支可能残留自已关闭的旧 PR；该分支专属本 workflow，强推覆盖即可。
          git push --force origin "HEAD:refs/heads/${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore(deps): upgrade aster-lang-ts to ${VERSION}" \
            --body "$(cat <<BODY
          Automated upgrade of \`@aster-cloud/aster-lang-ts\` to \`${VERSION}\` (pulled from npm by the scheduled auto-upgrade workflow).

          - \`package.json\` pin bumped (exact)
          - \`pnpm typecheck\`, \`pnpm lint\` and \`pnpm test\` passed in the upgrade run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          BODY
          )"
